name: Build & Release

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine version
        id: version
        shell: pwsh
        run: |
          # Find the latest vX.Y.Z tag, default to v1.0.0 if none exist.
          $latest = git tag -l 'v*' --sort=-v:refname | Select-Object -First 1
          if (-not $latest) {
            $next = "v1.0.0"
          } else {
            $parts = $latest.TrimStart('v').Split('.')
            $major = [int]$parts[0]
            $minor = [int]$parts[1]
            $patch = [int]$parts[2] + 1
            $next = "v$major.$minor.$patch"
          }
          Write-Host "Latest tag: $latest -> Next: $next"
          "VERSION=$next" | Out-File -Append $env:GITHUB_OUTPUT -Encoding utf8
          "VERSION_NUM=$($next.TrimStart('v'))" | Out-File -Append $env:GITHUB_OUTPUT -Encoding utf8

      - name: Stamp AssemblyInfo
        shell: pwsh
        run: |
          $ver = "${{ steps.version.outputs.VERSION_NUM }}.0"
          $file = "Properties\AssemblyInfo.cs"
          (Get-Content $file) `
            -replace 'AssemblyVersion\(".*?"\)', "AssemblyVersion(`"$ver`")" `
            -replace 'AssemblyFileVersion\(".*?"\)', "AssemblyFileVersion(`"$ver`")" |
            Set-Content $file -Encoding utf8
          Write-Host "Stamped $ver into $file"

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Restore NuGet packages
        run: nuget restore "VRC GIF to Emoji.csproj" 2>$null; exit 0
        shell: pwsh

      - name: Build Release
        run: msbuild "VRC GIF to Emoji.csproj" /t:Build /p:Configuration=Release /nologo /v:minimal

      - name: Package portable zip
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.VERSION }}"
          $outDir = "bin\Release"
          $zipName = "VRC-GIF-to-Emoji-$version-portable.zip"

          # Include the exe and all required dlls/configs, exclude dev files
          $files = Get-ChildItem $outDir -Include *.exe,*.dll,*.config,*.exe.config -File
          Compress-Archive -Path $files.FullName -DestinationPath $zipName -Force
          Write-Host "Created $zipName with $($files.Count) files"
          "ZIP_NAME=$zipName" | Out-File -Append $env:GITHUB_OUTPUT -Encoding utf8
        id: package

      - name: Create tag
        shell: pwsh
        run: |
          $tag = "${{ steps.version.outputs.VERSION }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a $tag -m "Release $tag"
          git push origin $tag

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.VERSION }}
          name: VRC GIF to Emoji ${{ steps.version.outputs.VERSION }}
          body: |
            **VRC GIF to Emoji ${{ steps.version.outputs.VERSION }}**

            Portable release — extract the zip and run `VRC GIF to Emoji.exe`.
            Requires .NET Framework 4.7.2 (included in Windows 10 1803+).

            ### What's included
            - GIF/image import (URL, file browse, drag & drop)
            - Frame editing (trim, reverse, keep-every-Nth, delete)
            - Pan & zoom crop preview (scroll to zoom, drag to pan)
            - Rotate / flip
            - FPS control
            - VRChat-compatible 1024×1024 sprite sheet output with auto-naming
          files: ${{ steps.package.outputs.ZIP_NAME }}
          generate_release_notes: true
